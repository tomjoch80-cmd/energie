<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDg1hmJlmVGMtt302JUNdYgxBaMZeuRekY",
    authDomain: "energie-ada39.firebaseapp.com",
    projectId: "energie-ada39",
    storageBucket: "energie-ada39.firebasestorage.app",
    messagingSenderId: "587914843142",
    appId: "1:587914843142:web:ade2fa931438b249a6df87"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const DOC = doc(db, 'energie', 'data');

  // Expose save function globally
  window._fbSave = async function(entries, settings, archived) {
    try {
      await setDoc(DOC, {
        entries: JSON.stringify(entries),
        settings: JSON.stringify(settings),
        archived: JSON.stringify(archived)
      });
      return true;
    } catch(e) { console.error('Firebase save error:', e); return false; }
  };

  // Listen for real-time updates
  onSnapshot(DOC, (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();
    try {
      const newEntries  = JSON.parse(d.entries  || '[]');
      const newSettings = JSON.parse(d.settings || 'null');
      const newArchived = JSON.parse(d.archived || '{}');
      if (window._fbLoaded) {
        // Merge remote data into app state
        window._fbMerge(newEntries, newSettings, newArchived);
      } else {
        // First load — initialize app with remote data
        window._fbInitData = { newEntries, newSettings, newArchived };
        window._fbLoaded = true;
      }
    } catch(e) { console.error('Firebase parse error:', e); }
  }, (err) => {
    console.warn('Firebase offline, using local data:', err.message);
    window._fbLoaded = true;
    window._fbInitData = null;
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#0f1923;--bg2:#162030;--bg3:#1e2d3d;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --text:#e8edf2;--text2:#7a90a4;--text3:#4a6070;
  --el:#4da6ff;--gas:#ffaa44;--wat:#44d4a0;
  --pos:#44d4a0;--neg:#ff6b6b;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;}

/* Header */
.hdr{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.hdr-title{font-size:18px;font-weight:600;letter-spacing:-.3px;}
.hdr-sub{font-size:12px;color:var(--text2);margin-top:1px;}

/* Nav */
.nav{display:flex;border-top:1px solid var(--border);}
.nb{flex:1;padding:9px 4px 11px;border:none;background:none;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'DM Sans',sans-serif;transition:color .15s;}
.nb i{font-size:20px;}
.nb.active{color:var(--el);}

/* Content */
.content{flex:1;overflow-y:auto;padding:14px 16px;overscroll-behavior:contain;}
.page{display:none;}
.page.active{display:block;}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.clabel{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;font-weight:500;}
.divider{height:1px;background:var(--border);margin:12px 0;}

/* Form */
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500;}
.fg input,.fg select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;}
.fg input:focus,.fg select:focus{border-color:var(--border2);}
.fg .hint{font-size:11px;color:var(--text3);margin-top:3px;}
.fg .hint.ok{color:var(--pos);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* Buttons */
.btn{width:100%;padding:12px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:var(--rs);border:none;transition:opacity .15s;}
.btn:active{opacity:.75;}
.btn-primary{background:var(--el);color:#0f1923;}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-weight:500;}
.btn-sm{padding:6px 12px;font-size:12px;font-weight:500;width:auto;border-radius:6px;}

/* Segment */
.seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:3px;margin-bottom:12px;}
.seg .sb{flex:1;padding:7px 4px;border:none;background:none;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:6px;transition:all .15s;}
.seg .sb.active{background:var(--bg3);color:var(--text);font-weight:500;}

/* Overview */
.med-block{margin-bottom:10px;}
.med-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.med-dot{width:8px;height:8px;border-radius:50%;}
.med-name{font-size:14px;font-weight:600;}
.med-period{font-size:11px;color:var(--text3);margin-left:auto;}
.prog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;}
.sbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px;}
.sbox-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.sbox-val{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;}
.sbox-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.total-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.total-label{font-size:12px;color:var(--text2);}
.total-sub{font-size:11px;color:var(--text3);}
.total-val{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;}

/* Archive toggle */
.arch-toggle{width:100%;background:none;border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;color:var(--text2);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.arch-toggle i{font-size:16px;transition:transform .2s;}
.arch-section{margin-top:8px;}
.arch-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;overflow:hidden;}
.arch-item-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;}
.arch-item-hdr:active{background:var(--bg3);}
.arch-item-label{font-size:13px;font-weight:500;}
.arch-item-meta{font-size:11px;color:var(--text2);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;}
.arch-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(68,212,160,.1);border:1px solid rgba(68,212,160,.25);color:var(--pos);}
.arch-detail{padding:0 14px 12px;border-top:1px solid var(--border);display:none;}
.arch-detail.open{display:block;}
.arch-sum3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 8px;}
.arch-sbox{background:var(--bg3);border-radius:6px;padding:8px;}
.arch-sbox-label{font-size:10px;color:var(--text3);margin-bottom:3px;}
.arch-sbox-val{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;}

/* Table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:5px 6px 8px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500;border-bottom:1px solid var(--border);}
td{padding:8px 6px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
td.r{text-align:right;font-family:'DM Mono',monospace;font-size:12px;}
td.pos{text-align:right;font-family:'DM Mono',monospace;font-size:12px;color:var(--pos);}
td.neg{text-align:right;font-family:'DM Mono',monospace;font-size:12px;color:var(--neg);}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px 5px;font-size:15px;}
.icon-btn:active{color:var(--text);}
.icon-btn.danger:active{color:var(--neg);}

/* Settings */
.sett-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.sett-med-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px;}
.plan-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.plan-row:last-child{border-bottom:none;}
.plan-from{font-weight:500;font-family:'DM Mono',monospace;font-size:12px;min-width:60px;}
.plan-vals{color:var(--text2);font-size:12px;}
.plan-actions{display:flex;gap:2px;}

/* Month+year picker */
.my-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* Misc */
.empty{text-align:center;padding:28px 16px;color:var(--text2);font-size:14px;line-height:1.7;}
.empty i{font-size:32px;display:block;margin-bottom:8px;color:var(--text3);}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 18px;font-size:13px;color:var(--text);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:99;}
.toast.show{opacity:1;}
.sec-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;font-weight:500;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div><div class="hdr-title">Energie</div><div class="hdr-sub" id="hdr-sub">Sledování spotřeby</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="sync-indicator" style="font-size:11px;color:var(--text3);display:none">↕ sync</span>
      <i class="ti ti-bolt" style="font-size:22px;color:var(--el)"></i>
    </div>
  </div>

  <div class="content" id="main-content">

    <!-- PŘEHLED -->
    <div class="page active" id="page-prehled">
      <div id="prehled-content"></div>
    </div>

    <!-- ODEČET -->
    <div class="page" id="page-add">
      <div class="card">
        <div class="clabel">Nový odečet</div>
        <div class="fg">
          <label>Médium</label>
          <select id="a-type" onchange="onAddTypeChange()">
            <option value="el">⚡ Elektřina</option>
            <option value="gas">🔥 Plyn</option>
            <option value="wat">💧 Voda</option>
          </select>
        </div>
        <div class="fr2">
          <div class="fg">
            <label>Rok</label>
            <select id="a-year" onchange="onAddMonthChange()"></select>
          </div>
          <div class="fg">
            <label>Měsíc</label>
            <select id="a-month" onchange="onAddMonthChange()">
              <option value="01">Leden</option><option value="02">Únor</option><option value="03">Březen</option>
              <option value="04">Duben</option><option value="05">Květen</option><option value="06">Červen</option>
              <option value="07">Červenec</option><option value="08">Srpen</option><option value="09">Září</option>
              <option value="10">Říjen</option><option value="11">Listopad</option><option value="12">Prosinec</option>
            </select>
          </div>
        </div>
        <div class="fg">
          <label id="a-stav-lbl">Stav měřidla (kWh)</label>
          <input type="number" id="a-stav" step="0.1" placeholder="0" onkeydown="if(event.key==='Enter')addEntry()"/>
        </div>
        <div class="fg" id="a-plan-info" style="background:var(--bg3);border-radius:var(--rs);padding:10px 12px;margin-bottom:2px;">
          <div style="font-size:12px;color:var(--text2)" id="a-plan-text">—</div>
        </div>
        <button class="btn btn-primary" style="margin-top:8px" onclick="addEntry()">Přidat odečet</button>
      </div>
    </div>

    <!-- HISTORIE -->
    <div class="page" id="page-history">
      <div class="seg" id="hist-seg">
        <button class="sb active" onclick="setHistType('el')">Elektřina</button>
        <button class="sb" onclick="setHistType('gas')">Plyn</button>
        <button class="sb" onclick="setHistType('wat')">Voda</button>
      </div>
      <div id="hist-content"></div>
    </div>

    <!-- NASTAVENÍ -->
    <div class="page" id="page-settings">

      <!-- Per-medium blocks -->
      <div id="sett-el" class="sett-block" style="padding:0;">
        <div onclick="toggleSettBlock('el')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">

        </div>
        <div id="sett-body-el" style="display:none;padding:0 16px 14px;">
        <div class="fr2">
          <div class="fg">
            <label>Výročí (začátek období)</label>

              <option value="4">Duben</option><option value="5">Květen</option><option value="6">Červen</option>
              <option value="7">Červenec</option><option value="8">Srpen</option><option value="9">Září</option>
              <option value="10">Říjen</option><option value="11">Listopad</option><option value="12">Prosinec</option>
            </select>
          </div>
          <div class="fg">
            <label>Počáteční stav (kWh)</label>
            <input type="number" id="s-init-el" step="0.1" placeholder="nepovinné"/>

        </div>
        <div class="divider"></div>
        <div class="sec-title">Výměny měřáku</div>
        <div id="replacements-el" style="margin-bottom:10px;min-height:10px;"></div>
        <div class="fr2" style="margin-bottom:6px;">
          <div class="fg" style="margin-bottom:0"><label>Měsíc výměny</label>
            <div class="my-pick">
              <select id="rep-y-el"><option value="2020">2020</option><option value="2021">2021</option><option value="2022">2022</option><option value="2023">2023</option><option value="2024" selected>2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option></select>

            </div>
          </div>
        </div>
        <div class="fr2" style="margin-bottom:6px;">
          <div class="fg" style="margin-bottom:0"><label>Cena (Kč/kWh)</label><input type="number" id="np-price-el" step="0.01" placeholder="0"/></div>
          <div class="fg" style="margin-bottom:0"><label>Záloha (Kč/měs)</label><input type="number" id="np-zal-el" step="10" placeholder="0"/></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="addPlan('el')" style="width:100%;margin-top:4px"><i class="ti ti-plus" style="font-size:13px"></i> Přidat ceník</button>
        </div>
      </div>

      <div id="sett-gas" class="sett-block" style="padding:0;">
        <div onclick="toggleSettBlock('gas')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
          <div class="sett-med-title" style="margin-bottom:0"><span style="width:8px;height:8px;border-radius:50%;background:var(--gas);display:inline-block"></span>Plyn</div>
          <i class="ti ti-chevron-down" id="sett-icon-gas" style="font-size:16px;color:var(--text3);transition:transform .2s;"></i>
        </div>
        <div id="sett-body-gas" style="display:none;padding:0 16px 14px;">
        <div class="fr2">
          <div class="fg">
            <label>Výročí (začátek období)</label>
            <select id="s-vyrocí-gas">
              <option value="1">Leden</option><option value="2">Únor</option><option value="3">Březen</option>
              <option value="4">Duben</option><option value="5">Květen</option><option value="6">Červen</option>
              <option value="7">Červenec</option><option value="8">Srpen</option><option value="9">Září</option>
              <option value="10">Říjen</option><option value="11">Listopad</option><option value="12">Prosinec</option>
            </select>
          </div>
          <div class="fg">
            <label>Počáteční stav (m³)</label>
            <input type="number" id="s-init-gas" step="0.1" placeholder="nepovinné"/>
          </div>
        </div>
        <div class="divider"></div>
        <div class="sec-title">Výměny měřáku</div>
        <div id="replacements-gas" style="margin-bottom:10px;min-height:10px;"></div>
        <div class="fr2" style="margin-bottom:6px;">
          <div class="fg" style="margin-bottom:0"><label>Měsíc výměny</label>
            <div class="my-pick">
              <select id="rep-y-gas"><option value="2020">2020</option><option value="2021">2021</option><option value="2022">2022</option><option value="2023">2023</option><option value="2024" selected>2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option></select>
              <select id="rep-m-gas"><option value="01">Leden</option><option value="02">Únor</option><option value="03">Březen</option><option value="04">Duben</option><option value="05">Květen</option><option value="06">Červen</option><option value="07">Červenec</option><option value="08">Srpen</option><option value="09">Září</option><option value="10">Říjen</option><option value="11">Listopad</option><option value="12">Prosinec</option></select>

        <button class="btn btn-ghost btn-sm" onclick="addReplacement('gas')" style="width:100%;margin-top:4px"><i class="ti ti-replace" style="font-size:13px"></i> Přidat výměnu</button>
        <div class="divider"></div>
        <div class="sec-title">Ceníky (cena + záloha od měsíce)</div>
        <div id="plans-gas" style="margin-bottom:10px;min-height:20px;"></div>
        <div class="fg" style="margin-bottom:6px;">

<div class="toast" id="toast"></div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const UNITS   = {el:'kWh', gas:'m³', wat:'m³'};
const LABELS  = {el:'Elektřina', gas:'Plyn', wat:'Voda'};
const COLORS  = {el:'#4da6ff', gas:'#ffaa44', wat:'#44d4a0'};
const CV      = {el:'var(--el)', gas:'var(--gas)', wat:'var(--wat)'};
const MS      = ['','Led','Úno','Bře','Dub','Kvě','Čer','Čvc','Srp','Zář','Říj','Lis','Pro'];
const ML      = ['','Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const TYPES   = ['el','gas','wat'];

// ─── State ────────────────────────────────────────────────────────────────────
// entries: [{id, type, month:'YYYY-MM', stav}]
// settings: {vyrocí:{el,gas,wat}, initStav:{el,gas,wat}, plans:{el:[{from,price,zaloha}], ...}}
// archived: {'el_YYYY-MM': true}

let entries  = JSON.parse(localStorage.getItem('en_entries') || '[]');
let settings = JSON.parse(localStorage.getItem('en_settings') || 'null') || {
  vyrocí: {el:1, gas:1, wat:1},
  initStav: {el:'', gas:'', wat:''},
  plans: {el:[], gas:[], wat:[]}
};
if(!settings.plans)      settings.plans   = {el:[], gas:[], wat:[]};
if(!settings.replacements) settings.replacements = {el:[], gas:[], wat:[]};
if(!settings.initStav)   settings.initStav= {el:'', gas:'', wat:''};
if(!settings.vyrocí)     settings.vyrocí  = {el:1, gas:1, wat:1};

let archived      = JSON.parse(localStorage.getItem('en_archived') || '{}');
let histType      = 'el';
let activePage    = 'prehled';
let archOpen      = false;
let openArchDet   = {};
let editingEntry  = null; // id of entry being edited

// ─── Persist ──────────────────────────────────────────────────────────────────
function persist(){
  localStorage.setItem('en_entries',  JSON.stringify(entries));
  localStorage.setItem('en_settings', JSON.stringify(settings));
  localStorage.setItem('en_archived', JSON.stringify(archived));
  // Also save to Firebase for cross-device sync
  if(window._fbSave) {
    const ind=document.getElementById('sync-indicator');
    if(ind){ind.style.display='inline';ind.textContent='↕ ukládám...';}
    window._fbSave(entries, settings, archived).then(()=>{
      if(ind){ind.textContent='✓ sync';setTimeout(()=>ind.style.display='none',2000);}
    }).catch(()=>{
      if(ind){ind.textContent='⚠ offline';setTimeout(()=>ind.style.display='none',3000);}
    });
  }
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ─── Year select population ───────────────────────────────────────────────────
function populateYearSelect(selId){
  const sel=document.getElementById(selId); if(!sel) return;
  const cur=new Date().getFullYear();
  sel.innerHTML='';
  for(let y=2018;y<=cur+3;y++){
    const o=document.createElement('option');
    o.value=y; o.textContent=y;
    if(y===cur) o.selected=true;
    sel.appendChild(o);
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Merge remote Firebase data into local state
window._fbMerge = function(newEntries, newSettings, newArchived) {
  entries  = newEntries;
  if(newSettings) {
    settings = newSettings;
    if(!settings.plans)    settings.plans    = {el:[],gas:[],wat:[]};
    if(!settings.initStav) settings.initStav = {el:'',gas:'',wat:''};
    if(!settings.vyrocí)   settings.vyrocí   = {el:1,gas:1,wat:1};
  }
  archived = newArchived || {};
  // Update localStorage cache
  localStorage.setItem('en_entries',  JSON.stringify(entries));
  localStorage.setItem('en_settings', JSON.stringify(settings));
  localStorage.setItem('en_archived', JSON.stringify(archived));
  // Re-render current page
  if(activePage==='prehled') renderPrehled();
  if(activePage==='history') renderHistory();
  if(activePage==='settings') TYPES.forEach(t=>{renderPlans(t);});
  // Update settings UI values
  TYPES.forEach(t=>{
    const vy=document.getElementById('s-vyrocí-'+t);
    const si=document.getElementById('s-init-'+t);
    if(vy) vy.value=settings.vyrocí[t]||1;
    if(si) si.value=settings.initStav[t]||'';
  });
};

function runInit() {
  // Populate year selects
  populateYearSelect('a-year');
  TYPES.forEach(t=>populateYearSelect('np-y-'+t));

  // Set current month in add form
  const now=new Date();
  document.getElementById('a-year').value=now.getFullYear();
  document.getElementById('a-month').value=String(now.getMonth()+1).padStart(2,'0');

  // Load settings into settings page
  TYPES.forEach(t=>{
    document.getElementById('s-vyrocí-'+t).value=settings.vyrocí[t]||1;
    document.getElementById('s-init-'+t).value=settings.initStav[t]||'';
    renderPlans(t);
    renderReplacements(t);
  });

  onAddTypeChange();
  renderPrehled();
}

// Wait up to 3s for Firebase, then fall back to localStorage
(function init(){
  const timeout = setTimeout(() => {
    // Firebase didn't respond in time, use local data
    runInit();
  }, 3000);

  function tryStart() {
    if(window._fbLoaded !== undefined) {
      clearTimeout(timeout);
      if(window._fbInitData) {
        window._fbMerge(
          window._fbInitData.newEntries,
          window._fbInitData.newSettings,
          window._fbInitData.newArchived
        );
      }
      runInit();
    } else {
      setTimeout(tryStart, 100);
    }
  }
  tryStart();
})();

// ─── Settings ─────────────────────────────────────────────────────────────────
function saveBaseSettings(){
  TYPES.forEach(t=>{
    settings.vyrocí[t]=parseInt(document.getElementById('s-vyrocí-'+t).value);
    const iv=document.getElementById('s-init-'+t).value;
    settings.initStav[t]=iv===''?'':parseFloat(iv);
  });
  persist();
  const el=document.getElementById('sett-saved');
  el.textContent='✓ Uloženo';
  setTimeout(()=>el.textContent='',2000);
  renderPrehled();
}

// Get plan valid for a given month (latest plan with from <= month)
function getPlan(type, month){
  const plans=(settings.plans[type]||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let match=null;
  for(const p of plans){ if(p.from<=month) match=p; }
  return match;
}

function renderReplacements(type){
  const cont=document.getElementById('replacements-'+type);
  if(!cont) return;
  const reps=(settings.replacements[type]||[]).slice().sort((a,b)=>b.from.localeCompare(a.from));
  if(!reps.length){
    cont.innerHTML='<div style="font-size:12px;color:var(--text3);padding:2px 0 4px">Žádné výměny měřáku.</div>';
    return;
  }
  let html='';
  reps.forEach(r=>{
    html+='<div class="plan-row">'
      +'<div><span class="plan-from">'+r.from+'</span>'
      +'<span class="plan-vals"> → nový stav: '+r.stav+' '+UNITS[type]+'</span></div>'
      +'<button class="icon-btn danger" onclick="deleteReplacement(this.dataset.t,this.dataset.f)" data-t="'+type+'" data-f="'+r.from+'" title="Smazat"><i class="ti ti-trash"></i></button>'
      +'</div>';
  });
  cont.innerHTML=html;
}

function addReplacement(type){
  const y=document.getElementById('rep-y-'+type).value;
  const m=document.getElementById('rep-m-'+type).value;
  const from=y+'-'+m;
  const stav=parseFloat(document.getElementById('rep-stav-'+type).value);
  if(isNaN(stav)){toast('Vyplň nový počáteční stav.');return;}
  if(!settings.replacements) settings.replacements={el:[],gas:[],wat:[]};
  settings.replacements[type]=settings.replacements[type].filter(r=>r.from!==from);
  settings.replacements[type].push({from,stav});
  settings.replacements[type].sort((a,b)=>a.from.localeCompare(b.from));
  persist();
  document.getElementById('rep-stav-'+type).value='';
  renderReplacements(type);
  toast('✓ Výměna měřáku od '+from+' uložena');
}

function deleteReplacement(typeOrEl,from){
  const type=typeof typeOrEl==='string'?typeOrEl:typeOrEl.dataset.t;
  from=from||typeOrEl.dataset.f;
  if(!confirm('Smazat výměnu měřáku od '+from+'?')) return;
  settings.replacements[type]=settings.replacements[type].filter(r=>r.from!==from);
  persist();
  renderReplacements(type);
  toast('Výměna smazána');
}


function addPlan(type){
  const y=document.getElementById('np-y-'+type).value;
  const m=document.getElementById('np-m-'+type).value;
  const from=y+'-'+m;
  const price=parseFloat(document.getElementById('np-price-'+type).value);
  const zaloha=parseFloat(document.getElementById('np-zal-'+type).value);
  if(isNaN(price)||isNaN(zaloha)){toast('Vyplň cenu i zálohu.');return;}
  settings.plans[type]=settings.plans[type].filter(p=>p.from!==from);
  settings.plans[type].push({from,price,zaloha});
  settings.plans[type].sort((a,b)=>a.from.localeCompare(b.from));
  persist();
  document.getElementById('np-price-'+type).value='';
  document.getElementById('np-zal-'+type).value='';
  renderPlans(type);
  toast('✓ Ceník od '+from+' uložen');
  onAddMonthChange();
}

function deletePlan(type, from){
  if(!confirm('Smazat ceník od '+from+'?')) return;
  settings.plans[type]=settings.plans[type].filter(p=>p.from!==from);
  persist();
  renderPlans(type);
  toast('Ceník smazán');
}

function renderPlans(type){
  const cont=document.getElementById('plans-'+type);
  if(!cont) return;
  const plans=(settings.plans[type]||[]).slice().sort((a,b)=>b.from.localeCompare(a.from));
  if(!plans.length){
    cont.innerHTML='<div style="font-size:12px;color:var(--text3);padding:2px 0 4px">Žádné ceníky — přidej první níže.</div>';
    return;
  }
  cont.innerHTML=plans.map(p=>`
    <div class="plan-row">
      <div>
        <span class="plan-from">${p.from}</span>
        <span class="plan-vals"> · ${p.price} Kč/${UNITS[type]} · záloha ${p.zaloha} Kč</span>
      </div>
      <div class="plan-actions">
        <button class="icon-btn danger" onclick="deletePlan('${type}','${p.from}')" title="Smazat"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');
}

// ─── Add form ─────────────────────────────────────────────────────────────────
function getAddMonth(){
  return document.getElementById('a-year').value+'-'+document.getElementById('a-month').value;
}

function onAddTypeChange(){
  const t=document.getElementById('a-type').value;
  document.getElementById('a-stav-lbl').textContent='Stav měřidla ('+UNITS[t]+')';
  onAddMonthChange();
}

function onAddMonthChange(){
  const t=document.getElementById('a-type').value;
  const month=getAddMonth();
  const plan=getPlan(t,month);
  const info=document.getElementById('a-plan-info');
  const txt=document.getElementById('a-plan-text');
  if(plan){
    txt.innerHTML=`<span style="color:var(--text2)">Ceník od <b>${plan.from}</b>: </span><span style="color:var(--text)">${plan.price} Kč/${UNITS[t]}</span><span style="color:var(--text3)"> · záloha </span><span style="color:var(--text)">${plan.zaloha} Kč</span>`;
    info.style.borderLeft='3px solid '+COLORS[t];
  } else {
    txt.innerHTML='<span style="color:var(--neg)">⚠ Žádný ceník pro tento měsíc — přidej ho v Nastavení.</span>';
    info.style.borderLeft='3px solid var(--neg)';
  }
}

function addEntry(){
  const type=document.getElementById('a-type').value;
  const month=getAddMonth();
  const stav=parseFloat(document.getElementById('a-stav').value);
  if(isNaN(stav)){toast('Vyplň stav měřidla.');return;}
  const plan=getPlan(type,month);
  if(!plan){toast('Nejdřív přidej ceník v Nastavení.');return;}

  if(editingEntry!==null){
    // Update existing
    const idx=entries.findIndex(e=>e.id===editingEntry);
    if(idx>=0) entries[idx]={...entries[idx], month, stav};
    editingEntry=null;
    document.querySelector('#page-add .btn-primary').textContent='Přidat odečet';
    document.querySelector('#page-add .clabel').textContent='Nový odečet';
  } else {
    if(entries.find(e=>e.type===type&&e.month===month)){toast('Odečet pro tento měsíc už existuje.');return;}
    entries.push({id:Date.now(), type, month, stav});
  }

  entries.sort((a,b)=>a.type.localeCompare(b.type)||a.month.localeCompare(b.month));
  persist();
  document.getElementById('a-stav').value='';

  // Advance month by 1
  const [y,m]=month.split('-').map(Number);
  const next=new Date(y,m,1);
  document.getElementById('a-year').value=next.getFullYear();
  document.getElementById('a-month').value=String(next.getMonth()+1).padStart(2,'0');
  onAddMonthChange();

  toast('✓ Odečet uložen');
  renderPrehled();
}

function startEditEntry(id){
  const e=entries.find(x=>x.id===id); if(!e) return;
  showPage('add');
  document.getElementById('a-type').value=e.type;
  document.getElementById('a-year').value=e.month.split('-')[0];
  document.getElementById('a-month').value=e.month.split('-')[1];
  document.getElementById('a-stav').value=e.stav;
  editingEntry=id;
  document.querySelector('#page-add .btn-primary').textContent='Uložit změny';
  document.querySelector('#page-add .clabel').textContent='Upravit odečet';
  onAddTypeChange();
}

function deleteEntry(id){
  if(!confirm('Smazat tento odečet?')) return;
  entries=entries.filter(e=>e.id!==id);
  persist();
  renderHistory();
  renderPrehled();
  toast('Odečet smazán');
}

// ─── Calculations ─────────────────────────────────────────────────────────────
function getByType(t){
  return entries.filter(e=>e.type===t).sort((a,b)=>a.month.localeCompare(b.month));
}

// Returns rows with consumption calculated. Uses initStav as baseline for first entry.
function calcRows(type){
  const list=getByType(type);
  const rows=[];
  if(!list.length) return rows;
  const initSt=settings.initStav[type];
  const hasInit=initSt!==''&&initSt!==null&&!isNaN(parseFloat(initSt));
  const reps=((settings.replacements||{})[type]||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  for(let i=0;i<list.length;i++){
    const c=list[i];
    let prevStav;
    const repAtMonth=reps.find(r=>r.from===c.month);
    if(repAtMonth){
      prevStav=repAtMonth.stav;
    } else if(i===0){
      if(hasInit) prevStav=parseFloat(initSt);
      else continue;
    } else {
      const prevMonth=list[i-1].month;
      const repBetween=reps.find(r=>r.from>prevMonth&&r.from<=c.month);
      if(repBetween) prevStav=repBetween.stav;
      else prevStav=list[i-1].stav;
    }
    const plan=getPlan(type,c.month);
    const price=plan?plan.price:0;
    const zaloha=plan?plan.zaloha:0;
    const spo=Math.round((c.stav-prevStav)*10)/10;
    const nak=Math.round(spo*price*10)/10;
    const usp=Math.round((zaloha-nak)*10)/10;
    rows.push({month:c.month,stavPrev:prevStav,stavCur:c.stav,spo,nak,price,zaloha,usp,id:c.id});
  }
  return rows;
}

// Period helpers
function getPeriodStart(type){
  const vm=settings.vyrocí[type]||1;
  const now=new Date();
  let y=now.getFullYear();
  if(now.getMonth()+1<vm) y--;
  return y+'-'+String(vm).padStart(2,'0');
}
function getPeriodEnd(type, startStr){
  const vm=settings.vyrocí[type]||1;
  const sy=parseInt(startStr.split('-')[0]);
  const ey=vm===1?sy:sy+1;
  const em=vm===1?12:vm-1;
  return ey+'-'+String(em).padStart(2,'0');
}
function getPct(type){
  const vm=settings.vyrocí[type]||1;
  const now=new Date();
  let y=now.getFullYear();
  if(now.getMonth()+1<vm) y--;
  const s=new Date(y,vm-1,1), e=new Date(y+1,vm-1,1);
  return Math.min(100,Math.max(0,Math.round((now-s)/(e-s)*100)));
}
function getAllPeriods(type){
  const vm=settings.vyrocí[type]||1;
  const list=getByType(type);
  const initSt=settings.initStav[type];
  const hasInit=initSt!==''&&initSt!==null&&!isNaN(parseFloat(initSt));
  // Use either first entry or initStav to determine earliest year
  if(!list.length && !hasInit) return [];
  let firstMonth=list.length?list[0].month:null;
  const now=new Date();
  let cy=now.getFullYear(); if(now.getMonth()+1<vm) cy--;
  let sy;
  if(firstMonth){
    const [fy,fm]=firstMonth.split('-').map(Number);
    sy=fy; if(fm<vm) sy=fy-1;
  } else {
    sy=cy;
  }
  const res=[];
  for(let y=sy;y<=cy;y++){
    const ps=y+'-'+String(vm).padStart(2,'0');
    const pe=getPeriodEnd(type,ps);
    const [psy,psm]=ps.split('-').map(Number);
    const [pey,pem]=pe.split('-').map(Number);
    res.push({start:ps,end:pe,key:type+'_'+ps,label:MS[psm]+' '+psy+' – '+MS[pem]+' '+pey});
  }
  return res.reverse();
}
function periodStats(type,ps,pe){
  // Include rows where month falls within period [ps, pe]
  // Note: a row's month is the month of the CURRENT reading (not the baseline)
  const rows=calcRows(type).filter(r=>r.month>=ps&&r.month<=pe);
  // Entries that are IN the period or are the baseline entry just before period start
  const ents=getByType(type).filter(e=>e.month>=ps&&e.month<=pe);
  const totalSpo=Math.round(rows.reduce((s,r)=>s+r.spo,0)*10)/10;
  const totalNak=Math.round(rows.reduce((s,r)=>s+r.nak,0));
  const totalZal=rows.reduce((s,r)=>s+r.zaloha,0);
  const totalUsp=Math.round(totalZal-totalNak);
  return{rows,ents,totalSpo,totalNak,totalZal,totalUsp};
}

function renderHistory(){
  const cont=document.getElementById('hist-content');
  const list=getByType(histType);
  if(!list.length){
    cont.innerHTML=`<div class="empty"><i class="ti ti-gauge"></i>Žádné odečty pro toto médium.</div>`;
    return;
  }
  const allRows=calcRows(histType);
  const periods=getAllPeriods(histType);
  let html='';

  const nowStr=new Date().toISOString().slice(0,7);
  // Track open/closed state per period key
  if(!window._histOpen) window._histOpen={};

  periods.forEach(({start,end,label,key})=>{
    const pRows=allRows.filter(r=>r.month>=start&&r.month<=end);
    const pEnts=list.filter(e=>e.month>=start&&e.month<=end);
    if(!pEnts.length && !pRows.length) return;
    const tSpo=Math.round(pRows.reduce((s,r)=>s+r.spo,0)*10)/10;
    const tNak=Math.round(pRows.reduce((s,r)=>s+r.nak,0));
    const tZal=pRows.reduce((s,r)=>s+r.zaloha,0);
    const tUsp=Math.round(pRows.reduce((s,r)=>s+r.usp,0));
    const uc=tUsp>=0?'var(--pos)':'var(--neg)'; const us=tUsp>=0?'+':'';
    const isClosed=end<nowStr;
    // Default: closed periods are collapsed, current is open
    if(window._histOpen[key]===undefined) window._histOpen[key]=!isClosed;
    const isOpen=window._histOpen[key];
    const closedBadge=isClosed?'<span style="font-size:10px;background:rgba(68,212,160,.1);border:1px solid rgba(68,212,160,.25);color:var(--pos);border-radius:4px;padding:2px 7px;margin-left:6px;">Uzavřeno</span>':'';

    // Summary line: spotřeba · zálohy · náklady · úspora
    const summaryStr=pRows.length
      ? tSpo+' '+UNITS[histType]+' · zálohy '+tZal.toLocaleString('cs')+' Kč · '+tNak.toLocaleString('cs')+' Kč · <span style="color:'+uc+'">'+us+tUsp.toLocaleString('cs')+' Kč</span>'

      +'<div>'

      +(summaryStr?'<div style="font-size:11px;color:var(--text2);margin-top:3px;">'+summaryStr+'</div>':'')

        +'<th>Měsíc / Stav</th>'

      });
      html+='<div class="card" style="padding:10px 12px;margin-bottom:8px;"><div class="tbl-wrap"><table>'+tblHtml+'</table></div></div>';
    }

  cont.innerHTML=html||`<div class="empty"><i class="ti ti-gauge"></i>Žádné záznamy.</div>`;
}

// ─── Export / Import ──────────────────────────────────────────────────────────
function exportJSON(){
  const data={entries,settings,archived,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,10);
  a.href=url; a.download='energie-zaloha-'+ts+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg=document.getElementById('export-msg');
  msg.textContent='✓ Záloha stažena';
  setTimeout(()=>msg.textContent='',2500);
}

function importJSON(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.entries||!data.settings){toast('Neplatný soubor zálohy.');return;}
      if(!confirm('Obnovit data ze zálohy? Aktuální data budou přepsána.')) return;
      entries=data.entries;
      settings=data.settings;
      archived=data.archived||{};
      if(!settings.plans) settings.plans={el:[],gas:[],wat:[]};
      if(!settings.initStav) settings.initStav={el:'',gas:'',wat:''};
      if(!settings.vyrocí) settings.vyrocí={el:1,gas:1,wat:1};
      if(!settings.replacements) settings.replacements={el:[],gas:[],wat:[]};
      persist();
      const msg=document.getElementById('export-msg');
      msg.textContent='✓ Data obnovena, obnovuji stránku...';
      setTimeout(()=>location.reload(),1000);
    }catch(err){
      toast('Chyba při čtení souboru.');
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function exportCSV(){
  let rows=[['Médium','Měsíc','Stav měřidla','Spotřeba','Cena/jednotka','Náklady','Záloha','Úspora']];
  TYPES.forEach(t=>{
    const r=calcRows(t);
    r.forEach(row=>{
      rows.push([LABELS[t],row.month,row.stavCur,row.spo,row.price,row.nak,row.zaloha,row.usp]);
    });
  });
  const NL=String.fromCharCode(13,10);
  const csv=rows.map((r,ri)=>r.map((v,ci)=>{
    let s=String(v);
    // Use comma as decimal separator for numeric columns (so Excel CZ doesn't read as date)
    if(ri>0 && ci>=2) s=s.replace('.',',');
    return s.includes(',')||s.includes(';')?'"'+s+'"':s;
  }).join(';')).join(NL);
  const BOM=String.fromCharCode(0xFEFF);
  const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ts=new Date().toISOString().slice(0,10);
  a.href=url; a.download='energie-export-'+ts+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const msg=document.getElementById('export-msg');
  msg.textContent='✓ CSV staženo';
  setTimeout(()=>msg.textContent='',2500);
}

async function resetAllData(){
  if(!confirm('Opravdu smazat VŠECHNA data? Tato akce je nevratná.')) return;
  if(!confirm('Jsi si jistý? Smažou se všechny odečty, ceníky i nastavení.')) return;
  const emptySettings={vyrocí:{el:1,gas:1,wat:1},initStav:{el:'',gas:'',wat:''},plans:{el:[],gas:[],wat:[]},replacements:{el:[],gas:[],wat:[]}};
  // First save empty data to Firebase, then clear local and reload
  localStorage.clear();
  if(window._fbSave){
    await window._fbSave([], emptySettings, {});
  }
  location.reload();
}

function toggleSettBlock(t){
  const body=document.getElementById('sett-body-'+t);
  const icon=document.getElementById('sett-icon-'+t);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  if(icon) icon.style.transform=open?'rotate(180deg)':'';
}

function showPage(p){
  activePage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='history') renderHistory();
  if(p==='prehled') renderPrehled();
  if(p==='add'){ if(!editingEntry) onAddMonthChange(); }
  if(p==='settings') TYPES.forEach(t=>{renderPlans(t);renderReplacements(t);});
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// Swipe between pages
(function(){
  const pages=['prehled','add','history','settings'];
  let startX=0, startY=0, locked=false;
  document.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(locked) return;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5) return;
    locked=true;
    setTimeout(()=>locked=false, 400);
    const idx=pages.indexOf(activePage);
    if(dx<0&&idx<pages.length-1) showPage(pages[idx+1]);
    if(dx>0&&idx>0) showPage(pages[idx-1]);
  },{passive:true});
})();
</script>
